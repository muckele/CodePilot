name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Python service dependencies
        run: |
          python -m venv services/ai/.venv
          services/ai/.venv/bin/pip install --disable-pip-version-check uv==0.12.3
          UV_CACHE_DIR="$RUNNER_TEMP/codelift-uv" services/ai/.venv/bin/uv sync \
            --project services/ai --locked --extra dev

      - name: Start MongoDB replica set
        run: docker compose -f infra/compose.m2.yaml up -d --wait

      - name: Run release quality report
        env:
          MONGO_URI: mongodb://127.0.0.1:27018/codelift?replicaSet=rs0&directConnection=true
          MONGO_DB_NAME: codelift
          PERSISTENCE_MODE: required
        run: pnpm quality:report

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality
          path: reports/
          if-no-files-found: warn

      - name: Stop MongoDB replica set
        if: always()
        run: docker compose -f infra/compose.m2.yaml down
