map $uri $codelift_cache_policy {
  default "no-cache";
  "~^/assets/.*\.[A-Za-z0-9_-]{8,}\.(?:css|js|woff2?|png|svg|webp)$" "public, max-age=31536000, immutable";
}

log_format codelift_privacy '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
  add_header Cache-Control $codelift_cache_policy always;

  access_log /var/log/nginx/access.log codelift_privacy;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types application/javascript application/json application/problem+json image/svg+xml text/css text/plain;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  location = /health {
    access_log off;
    proxy_pass http://api:4000/health;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ready {
    access_log off;
    proxy_pass http://api:4000/ready;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    access_log off;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /register {
    access_log off;
    try_files /index.html =404;
  }

  # Recovery tokens live in a URL fragment, which is never sent to the server,
  # only long enough for the browser to submit them in a protected request body.
  location = /reset-password {
    access_log off;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
