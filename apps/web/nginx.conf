map $uri $codelift_cache_policy {
  default "no-cache";
  "~^/assets/.*\.[A-Za-z0-9_-]{8,}\.(?:css|js|woff2?|png|svg|webp)$" "public, max-age=31536000, immutable";
}

# Empty by default. A deployment may mount an exact ingress-address allowlist
# only after proving that ingress cannot be reached around its trusted proxy.
geo $codelift_trusted_ingress {
  default 0;
  include /etc/nginx/codelift-trusted-ingress.conf;
}
map "$codelift_trusted_ingress:$http_x_forwarded_proto" $codelift_forwarded_scheme {
  default $scheme;
  ~^1:https$ https;
}
map "$codelift_trusted_ingress:$http_x_forwarded_proto" $codelift_forwarded_port {
  default $server_port;
  ~^1:https$ 443;
}
map $uri $codelift_access_limit_key {
  default "";
  ~*^/api/v1/auth/(?:login|register|reset-password|csrf)/?$ $binary_remote_addr;
}
limit_req_zone $codelift_access_limit_key zone=codelift_access:1m rate=6r/m;

log_format codelift_privacy '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
  add_header Cache-Control $codelift_cache_policy always;

  access_log /var/log/nginx/access.log codelift_privacy;
  # Rejected access bursts must not emit the raw query-bearing request target.
  error_log /var/log/nginx/error.log warn;

  proxy_set_header Host $http_host;
  proxy_set_header Origin $http_origin;
  proxy_set_header X-Forwarded-Proto $codelift_forwarded_scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $codelift_forwarded_port;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types application/javascript application/json application/problem+json image/svg+xml text/css text/plain;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  location = /health {
    access_log off;
    proxy_pass http://api:4000/health;
  }

  location = /ready {
    access_log off;
    proxy_pass http://api:4000/ready;
  }

  location /api/ {
    access_log off;
    # Empty keys do not enter the zone: assets and curriculum remain unmetered.
    limit_req zone=codelift_access burst=20 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
  }

  location = /register {
    access_log off;
    try_files /index.html =404;
  }

  # Recovery tokens live in a URL fragment, which is never sent to the server,
  # only long enough for the browser to submit them in a protected request body.
  location = /reset-password {
    access_log off;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
