[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codelift-ai-service"
version = "0.1.0"
description = "Typed, mock-first CodeLift AI analytics and provider service."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "pandas>=2.2,<4",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1"
]
local-models = [
  "torch>=2.7,<3",
  "transformers>=4.53,<5",
  "peft>=0.17,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
